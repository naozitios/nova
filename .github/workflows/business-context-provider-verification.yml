name: Business Context Provider Verification

on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark-groq.ts'
      - '.github/workflows/business-context-provider-verification.yml'
      - 'src/infrastructure/business-context/llm-extraction.adapter.ts'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmark-groq.ts'
      - '.github/workflows/business-context-provider-verification.yml'
      - 'src/infrastructure/business-context/llm-extraction.adapter.ts'
  workflow_dispatch:

env:
  BUSINESS_CONTEXT_RUN_PROVIDER_TESTS: '1'

jobs:
  groq-benchmark:
    name: Groq Provider Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Groq provider benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run benchmark:groq | tee provider-benchmark-report.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-provider-benchmark-report
          path: provider-benchmark-report.json
          retention-days: 30
          if-no-files-found: error
